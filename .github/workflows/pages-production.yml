name: Pages production deploy

# Cloudflare Pages skips Git pushes whose message is prefixed with
# [CF-Pages-Skip] or [skip ci]. seo/* commits must keep that prefix, so main
# merges were not published. This workflow decides from changed paths and, when
# the change is publishable, uploads the built site with Wrangler. sns-bot
# state-only commits stay skipped. workflow_dispatch force=true is the explicit
# publish trigger.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: "true ならパス判定を無視して本番公開する"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  decide-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Decide from changed paths
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force }}
          BEFORE_SHA: ${{ github.event.before }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            echo "action=deploy" >> "$GITHUB_OUTPUT"
            echo "reason=explicit_publish_trigger" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "push" ] && [ -n "${BEFORE_SHA}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" > /tmp/changed-paths.txt
          else
            git diff --name-only HEAD~1 HEAD > /tmp/changed-paths.txt || true
          fi
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          import { decidePagesProductionDeploy } from "./scripts/pages_deploy_decision.mjs";
          const changedPaths = readFileSync("/tmp/changed-paths.txt", "utf8")
            .split("\n")
            .map((line) => line.trim())
            .filter(Boolean);
          const decision = decidePagesProductionDeploy({
            changedPaths,
            commitMessage: process.env.COMMIT_MESSAGE || "",
          });
          console.log(JSON.stringify(decision));
          appendFileSync(process.env.GITHUB_OUTPUT, `action=${decision.action}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `reason=${decision.reason}\n`);
          NODE

      - name: Skip sns-bot state only
        if: steps.decision.outputs.action != 'deploy'
        run: echo "Skipping production deploy: ${{ steps.decision.outputs.reason }}"

      - name: Install, test decision, and build
        if: steps.decision.outputs.action == 'deploy'
        run: |
          npm ci
          node scripts/pages_deploy_decision.test.mjs
          npm run build

      - name: Deploy production with Wrangler
        if: steps.decision.outputs.action == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required for path-based production deploy."
            exit 1
          fi
          npx --yes wrangler@3 pages deploy build --project-name shikaku-catalog --branch main --commit-hash "$GITHUB_SHA"
